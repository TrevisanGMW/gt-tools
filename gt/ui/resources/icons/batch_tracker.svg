			<line x1="78" y1="130" x2="145" y2="130" style="stroke:#1D1D1D;stroke-width:14;stroke-linecap:round;"/>
			<line x1="78" y1="160" x2="128" y2="160" style="stroke:#1D1D1D;stroke-width:14;stroke-linecap:round;"/>
		</g>
		<g>
			<rect x="198" y="31" width="116" height="142" rx="16" style="fill:#909090;stroke:#1D1D1D;stroke-width:16;"/>
			<path d="M270,31 L314,75 H270 Z" style="fill:#D0D0D0;stroke:#1D1D1D;stroke-width:12;stroke-linejoin:round;"/>
			<line x1="221" y1="106" x2="288" y2="106" style="stroke:#1D1D1D;stroke-width:14;stroke-linecap:round;"/>
			<line x1="221" y1="136" x2="271" y2="136" style="stroke:#1D1D1D;stroke-width:14;stroke-linecap:round;"/>
		</g>
		<g transform="rotate(12 399 126)">
			<rect x="341" y="55" width="116" height="142" rx="16" style="fill:#737373;stroke:#1D1D1D;stroke-width:16;"/>
			<path d="M413,55 L457,99 H413 Z" style="fill:#BDBDBD;stroke:#1D1D1D;stroke-width:12;stroke-linejoin:round;"/>
			<line x1="364" y1="130" x2="431" y2="130" style="stroke:#1D1D1D;stroke-width:14;stroke-linecap:round;"/>
			<line x1="364" y1="160" x2="414" y2="160" style="stroke:#1D1D1D;stroke-width:14;stroke-linecap:round;"/>
		</g>

		<!-- A friendly funnel combines the batch into one processed result. -->
		<path d="M62,225 Q62,205 82,205 H430 Q450,205 450,225 L321,349 V430 L256,474 L191,430 V349 Z"
