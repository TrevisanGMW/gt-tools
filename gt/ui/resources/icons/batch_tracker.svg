			  style="fill:#E0E0E0;stroke:#1D1D1D;stroke-width:12;stroke-linejoin:round;"/>
		<circle cx="156" cy="273" r="16" style="fill:#909090;stroke:#1D1D1D;stroke-width:10;"/>
		<circle cx="356" cy="271" r="16" style="fill:#909090;stroke:#1D1D1D;stroke-width:10;"/>
		<path d="M239,413 L256,430 L285,397" style="fill:none;stroke:#1D1D1D;stroke-width:16;stroke-linecap:round;stroke-linejoin:round;"/>
