          d="M244,353h83v-39l69,62l-69,62v-39h-83V353z"/>

    <!-- A bold gear silhouette remains readable in Maya menus and title bars. -->
    <g style="fill:#65AF5F;stroke:#1D1D1D;stroke-width:16;stroke-linejoin:round;">
        <rect x="369" y="277" width="66" height="180" rx="10"/>
        <rect x="312" y="334" width="180" height="66" rx="10"/>
        <rect x="369" y="277" width="66" height="180" rx="10" transform="rotate(45 402 367)"/>
        <rect x="369" y="277" width="66" height="180" rx="10" transform="rotate(-45 402 367)"/>
    </g>
    <circle cx="402" cy="367" r="86" style="fill:#6BBE66;stroke:#1D1D1D;stroke-width:18;"/>
    <circle cx="402" cy="367" r="35" style="fill:#BDBDBD;stroke:#1D1D1D;stroke-width:16;"/>
</g>
